<DOCTYPE html>
<html>
<head>
<title>select in a form</title>
</head>
   
   
   <body bgcolor="green">
   first name
   <input type="text" name="firstname" value="jupert"><br>
   lastname
   <input type="text" name="lastname" value="dary"><br>
   age
   <input type="number" name="age" value="21"><br>
   
   <input type="Radio" name="fruit" value="banana" checked>banana<br>
   <input type="Radio" name="fruit" value="orangee">orangee<br>
   <input type="Radio" name="fruit" value="apple">apple<br>
   
   select
   <select type="cars" size="3">
   <option value="tata">tata</option>
   <option value="tezz">tezz</option>
   <option value="corolla">corolla</option>
   <option value="bmw">bmw</option>
   </select>
   multiple
   <select type="cars" size="4" multiple>
   <option value="tata">tata</option>
   <option value= "tezz">tezz</option>
   <option value="corolla">corolla</option>
   <option value="bmw">bmw</option>
   </select>



</body>
</html>
